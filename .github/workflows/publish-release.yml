name: Publish signed Whisper AI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag to publish, such as v4.0.0. Leave empty for latest.
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: tyspam/WhisperAI-Downloads
      UPDATE_BASE_URI: https://github.com/tyspam/WhisperAI-Downloads/releases/latest/download

    steps:
      - name: Checkout distribution files
        uses: actions/checkout@v4
        with:
          path: distribution

      - name: Checkout private application source read-only
        uses: actions/checkout@v4
        with:
          repository: tyspam/Whisper_Ai-OI-Translation-Transcription-Tool
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          path: source

      - name: Select source tag and required artifacts
        id: select
        shell: pwsh
        run: |
          $requested = "${{ inputs.tag }}".Trim()
          if ($requested) {
            $tag = $requested
          } else {
            $tag = git -C source tag --list "v*" |
              Where-Object { $_ -match '^v\d+(\.\d+){1,2}$' } |
              Sort-Object { [version]$_.Substring(1) } -Descending |
              Select-Object -First 1
          }
          if (-not $tag) { throw "No version tag was found in the private source repository." }
          git -C source checkout --detach $tag
          $version = python -c "import sys; sys.path.insert(0, 'source'); from app_version import __version__; print(__version__)"
          if ($tag -ne "v$version") { throw "Source tag $tag does not match app_version.py v$version." }
          $releaseJson = gh release view $tag --repo $env:RELEASE_REPOSITORY --json assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $setupExists = $false
          if ($releaseExists) {
            $assets = ($releaseJson | ConvertFrom-Json).assets
            $setupExists = $null -ne ($assets | Where-Object name -eq "WhisperAI-Setup.exe")
          }
          "build_app=$(!$releaseExists)".ToLowerInvariant() | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_setup=$(!$setupExists)".ToLowerInvariant() | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_exists=$releaseExists".ToLowerInvariant() | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $global:LASTEXITCODE = 0
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        if: steps.select.outputs.build_app == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-packaged.txt
            source/requirements-build.txt

      - uses: actions/setup-node@v4
        if: steps.select.outputs.build_app == 'true'
        with:
          node-version: "22"

      - name: Install FFmpeg and Python dependencies
        if: steps.select.outputs.build_app == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-packaged.txt -r source/requirements-build.txt

      - name: Test and build application bundle
        if: steps.select.outputs.build_app == 'true'
        shell: pwsh
        working-directory: source
        run: |
          python release_gate.py
          packaging/Build-Windows.ps1 -Python python -SkipDependencyInstall -SkipTests
          packaging/Test-Package.ps1

      - name: Restore signing certificate
        if: steps.select.outputs.build_app == 'true' || steps.select.outputs.build_setup == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\WhisperAI-Signing.pfx", $bytes)
          Import-Certificate -FilePath distribution/WhisperAI-Publisher.cer `
            -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

      - name: Build and verify signed MSIX
        if: steps.select.outputs.build_app == 'true'
        shell: pwsh
        working-directory: source
        run: |
          packaging/Build-MSIX.ps1 `
            -Version "${{ steps.select.outputs.version }}" `
            -Publisher "${{ secrets.WINDOWS_SIGNING_PUBLISHER }}" `
            -UpdateBaseUri $env:UPDATE_BASE_URI `
            -CertificatePath "$env:RUNNER_TEMP\WhisperAI-Signing.pfx" `
            -CertificatePassword "${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}"
          Copy-Item ../distribution/WhisperAI-Publisher.cer dist/release/
          Copy-Item ../distribution/Install-WhisperAI.ps1 dist/release/

      - name: Prepare one-file installer inputs
        if: steps.select.outputs.build_setup == 'true'
        shell: pwsh
        run: |
          if ("${{ steps.select.outputs.build_app }}" -eq "true") {
            Copy-Item source/dist/release/WhisperAI.appinstaller distribution/WhisperAI.appinstaller -Force
          } else {
            gh release download "${{ steps.select.outputs.tag }}" `
              --repo $env:RELEASE_REPOSITORY `
              --pattern WhisperAI.appinstaller `
              --dir distribution `
              --clobber
          }
          choco install innosetup -y --no-progress

      - name: Build, sign, and verify one-file installer
        if: steps.select.outputs.build_setup == 'true'
        shell: pwsh
        run: |
          $env:WHISPERAI_VERSION = "${{ steps.select.outputs.version }}"
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc distribution/installer/WhisperAI.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "SignTool was not found." }
          $setup = "distribution\dist\WhisperAI-Setup.exe"
          & $signTool sign /fd SHA256 /f "$env:RUNNER_TEMP\WhisperAI-Signing.pfx" `
            /p "${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}" $setup
          if ($LASTEXITCODE -ne 0) { throw "Signing the setup executable failed." }
          & $signTool verify /pa /v $setup
          if ($LASTEXITCODE -ne 0) { throw "Setup signature verification failed." }
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Publish public binary release
        if: steps.select.outputs.build_app == 'true'
        shell: pwsh
        working-directory: source
        run: |
          gh release create "${{ steps.select.outputs.tag }}" dist/release/* `
            --repo $env:RELEASE_REPOSITORY `
            --title "Whisper AI ${{ steps.select.outputs.version }}" `
            --notes "Signed internal Windows release. Follow the installation instructions in the downloads repository."

      - name: Publish one-file installer
        if: steps.select.outputs.build_setup == 'true'
        shell: pwsh
        run: |
          gh release upload "${{ steps.select.outputs.tag }}" `
            distribution/dist/WhisperAI-Setup.exe `
            --repo $env:RELEASE_REPOSITORY `
            --clobber
